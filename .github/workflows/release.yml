# Builds Sil-Q for the Asciiverse catalog: one archive per target, named
# sil-q-<target>.tar.gz, plus a SHA256SUMS file, attached to a GitHub
# release (hub/catalog/SCHEMA.md, release.source = "github"). Runs on a
# pushed tag, or by hand for an existing tag. This replaces Sil-Q's own
# release workflow and its per-platform builds (Windows, Cocoa, X11), which
# the Asciiverse does not ship.
#
# Only the curses (gcu) frontend is built. Linux builds run in Alpine and
# link ncurses statically, so the binaries carry the -musl triple that av
# looks for first and need no libncurses on the player's machine. macOS
# links the system ncurses, which every Mac has. No Windows build: the
# curses frontend leans on POSIX terminals (termios, SIGWINCH), and Sil-Q's
# own Windows edition is its graphical one.

name: release

on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Build and package
        run: |
          docker run --rm -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base cmake ncurses-dev ncurses-static git zip &&
            git config --global --add safe.directory /src &&
            STATIC=1 asciiverse/build.sh &&
            asciiverse/package.sh ${{ matrix.target }}'
          file out/sil

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, arch: x86_64 }
          - { target: aarch64-apple-darwin, arch: arm64 }
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Build and package
        run: |
          CMAKE_ARGS="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0" asciiverse/build.sh
          file out/sil
          asciiverse/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Sil-Q $TAG" \
                 --notes "Sil-Q $TAG, the terminal (curses) build, packaged for the Asciiverse catalog: one archive per target. Changes from Sil-Q are listed in PATCHES.md."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
